version: v2
# The single input `buf generate` and `scripts/generate-protobuf.sh` run over. Add a `deps` entry
# here and an import in `generation.proto` to pull another module's types into the generated tree.
modules:
  - path: .
deps:
  # Pinned to the feature/support-morphtx-type branch (streamingfast/firehose-ethereum#224) while it
  # is pending Morph team approval. Switch back to the unqualified module ref, which tracks
  # `develop`, once that PR merges.
  - buf.build/streamingfast/firehose-ethereum:feature/support-morphtx-type
  - buf.build/streamingfast/firehose
lint:
  # `generation.proto` is generation config, not schema: it is deliberately outside the directory
  # its package names and its imports are deliberately unused.
  ignore:
    - generation.proto
