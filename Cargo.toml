[workspace]
members = ["firehose-tracer", "firehose-tracer-prestate", "firehose-tracer-test"]
exclude = ["resources"]
resolver = "2"

[workspace.package]
version = "5.4.1"
edition = "2021"
description = "Chain-agnostic EVM execution tracer producing Firehose protobuf blocks"
license = "Apache-2.0"
repository = "https://github.com/streamingfast/evm-firehose-tracer-rs"
homepage = "https://github.com/streamingfast/evm-firehose-tracer-rs"

[workspace.dependencies]
# Internal workspace crates
firehose-tracer = { version = "5.4.1", path = "firehose-tracer" }
firehose-tracer-test = { version = "5.4.1", path = "firehose-tracer-test" }
firehose-tracer-prestate = { version = "5.4.1", path = "firehose-tracer-prestate" }

# Alloy dependencies
alloy-consensus = "2.0"
alloy-eips = "2.0"
alloy-genesis = "2.0"
alloy-primitives = "1.5"
alloy-rlp = "0.3"
alloy-rpc-client = "2.0"
alloy-transport-http = "2.0"

# Other dependencies
clap = { version = "4", features = ["derive", "env"] }
eyre = "0.6"
futures-util = "0.3"
hex = "0.4"
num_enum = "0.7"
prost = "0.14"
prost-types = "0.14"
prost-build = "0.14"
prost-reflect = "0.16"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["tls-ring", "tls-native-roots", "transport", "codegen"] }
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
color-eyre = "0.6"
base64-simd = "0.8"
